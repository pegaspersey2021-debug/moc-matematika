            async refreshQuestionsFromSheet() {
                await this.loadQuestions(true);
                this.render();
            },

            /**
             * ====================================================================
             * B) IMTIHON JARAYONI (CHIZMALARNI KO'RSATISH BILAN)
             * ====================================================================
             */
            startExam(e) {
                e.preventDefault();
                const name = document.getElementById('student-name').value.trim();
                const group = document.getElementById('student-group').value.trim();
                if (!name || !group) return;

                const cfg = this.getConfig();
                const session = {
                    studentName: name,
                    studentGroup: group,
                    startTime: Date.now(),
                    endTime: Date.now() + cfg.durationMinutes * 60 * 1000,
                    answers: {}
                };

                this.saveActiveSession(session);
                this.state.currentExamQuestion = this.state.questions[0]?.id || 1;
                this.state.view = 'exam';
                this.render();
                this.toast("Imtihon boshlandi! Omad tilaymiz!", "info");
            },

            renderExamView() {
                const session = this.getActiveSession();
                if (!session) {
                    this.state.view = 'home';
                    return this.renderHomeView();
                }

                const questions = this.state.questions;
                const q = questions.find(item => item.id === this.state.currentExamQuestion) || questions[0];
                const currentAns = session.answers[q.id];

                let answeredCount = 0;
                questions.forEach(item => {
                    const a = session.answers[item.id];
                    if (item.type === 'closed' && a) answeredCount++;
                    if (item.type === 'open' && a && ((a.a && a.a.trim()) || (a.b && a.b.trim()))) answeredCount++;
                });

                return `
                <div class="space-y-5 fade-in">
                    <!-- Yuqori Axborot va Taymer Paneli -->
                    <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center font-bold">
                                <i class="fa-solid fa-user-graduate"></i>
                            </div>
                            <div>
                                <div class="font-bold text-slate-900 text-sm sm:text-base">${this.escapeHtml(session.studentName)}</div>
                                <div class="text-xs text-slate-500">${this.escapeHtml(session.studentGroup)} • Bajarildi: <strong class="text-slate-700">${answeredCount}/${questions.length}</strong></div>
                            </div>
                        </div>

                        <div class="flex items-center gap-3">
                            <div id="exam-timer-box" class="px-4 py-2 rounded-xl bg-slate-900 text-white font-mono font-bold text-base sm:text-lg flex items-center gap-2 shadow-inner">
                                <i class="fa-regular fa-clock text-blue-400"></i>
                                <span id="exam-timer-text">--:--:--</span>
                            </div>

                            <button onclick="app.confirmFinishExam()" class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm transition shadow-sm flex items-center gap-2">
                                <i class="fa-solid fa-paper-plane"></i>
                                <span>Yakunlash</span>
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                        <!-- Savol oynasi -->
                        <div class="lg:col-span-8 bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm">
                            <div class="flex items-center justify-between pb-4 mb-6 border-b border-slate-100">
                                <div class="flex items-center gap-2.5">
                                    <span class="px-3 py-1 rounded-lg bg-blue-700 text-white font-bold text-sm">
                                        ${q.id}-savol
                                    </span>
                                    ${q.type === 'closed'
                                        ? `<span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 text-xs font-semibold">Yopiq test (A, B, C, D)</span>`
                                        : `<span class="px-2.5 py-1 rounded-lg bg-indigo-100 text-indigo-700 text-xs font-semibold">Yozma topshiriq (a va b shartlar)</span>`
                                    }
                                </div>
                                <span class="text-xs text-slate-400 font-medium">${q.id} / ${questions.length}</span>
                            </div>

                            <!-- Savol matni -->
                            <div class="text-base sm:text-lg text-slate-900 font-medium leading-relaxed mb-5 whitespace-pre-line">
                                ${this.escapeHtml(q.text)}
                            </div>

                            <!-- AGAR SAVOLDA CHIZMA / RASM BO'LSA SHU YERDA CHIQADI -->
                            ${q.imageUrl ? `
                                <div class="mb-6 bg-slate-50 border border-slate-200 rounded-2xl p-3 flex flex-col items-center">
                                    <img src="${this.escapeHtml(q.imageUrl)}"
                                         alt="${q.id}-savol chizmasi"
                                         onclick="app.zoomImage(this.src)"
                                         onerror="this.parentElement.innerHTML='<span class=\\'text-xs text-rose-500\\'><i class=\\'fa-solid fa-image-slash mr-1\\'></i>Chizma yuklanmadi (havolani tekshiring)</span>'"
                                         class="max-h-72 w-auto object-contain rounded-xl cursor-zoom-in transition hover:scale-[1.01]">
                                    <span class="text-[11px] text-slate-400 mt-2"><i class="fa-solid fa-magnifying-glass-plus mr-1"></i>Kattalashtirish uchun chizma ustiga bosing</span>
                                </div>
                            ` : ''}

                            ${q.type === 'closed' ? `
                                <div class="space-y-3">
                                    ${['A', 'B', 'C', 'D'].map(opt => {
                                        const isSelected = currentAns === opt;
                                        return `
                                        <button type="button" onclick="app.selectClosedOption(${q.id}, '${opt}')"
                                            class="w-full text-left p-4 rounded-2xl border-2 transition flex items-center gap-4 ${
                                                isSelected
                                                ? 'border-blue-700 bg-blue-50/70 text-slate-900 shadow-sm'
                                                : 'border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-slate-700'
                                            }">
                                            <span class="w-9 h-9 rounded-xl flex items-center justify-center font-bold text-sm shrink-0 transition ${
                                                isSelected ? 'bg-blue-700 text-white' : 'bg-slate-100 text-slate-600'
                                            }">${opt}</span>
                                            <span class="text-sm sm:text-base font-medium">${this.escapeHtml(q.options[opt] || '')}</span>
                                        </button>
                                        `;
                                    }).join('')}
                                </div>
                            ` : `
                                <div class="space-y-5 bg-slate-50 p-5 rounded-2xl border border-slate-200/80">
                                    <div class="text-xs text-slate-500 bg-white px-3 py-2 rounded-xl border border-slate-200/70">
                                        <i class="fa-solid fa-circle-info text-blue-600 mr-1"></i>
                                        Javob formati: butun son (<code>5</code>), o'nli kasr (<code>0.4</code>) yoki oddiy kasr (<code>3/4</code>) ko'rinishida yozing.
                                    </div>

                                    <div>
                                        <div class="text-sm font-bold text-indigo-950 mb-2">
                                            ${this.escapeHtml(q.partAPrompt)}
                                        </div>
                                        <div class="flex items-center gap-2">
                                            <span class="px-3 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-sm">a)</span>
                                            <input type="text"
                                                value="${this.escapeHtml((currentAns && currentAns.a) || '')}"
                                                oninput="app.inputOpenAnswer(${q.id}, 'a', this.value)"
                                                placeholder="a) sharti javobi..."
                                                class="flex-1 px-4 py-2.5 rounded-xl border border-slate-300 bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/20 outline-none text-sm font-medium">
                                        </div>
                                    </div>

                                    <div class="pt-3 border-t border-slate-200">
                                        <div class="text-sm font-bold text-indigo-950 mb-2">
                                            ${this.escapeHtml(q.partBPrompt)}
                                        </div>
                                        <div class="flex items-center gap-2">
                                            <span class="px-3 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-sm">b)</span>
                                            <input type="text"
                                                value="${this.escapeHtml((currentAns && currentAns.b) || '')}"
                                                oninput="app.inputOpenAnswer(${q.id}, 'b', this.value)"
                                                placeholder="b) sharti javobi..."
                                                class="flex-1 px-4 py-2.5 rounded-xl border border-slate-300 bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/20 outline-none text-sm font-medium">
                                        </div>
                                    </div>
                                </div>
                            `}

                            <div class="flex items-center justify-between mt-8 pt-5 border-t border-slate-100">
                                <button onclick="app.navigateQuestion(${q.id - 1})" ${q.id === 1 ? 'disabled' : ''}
                                    class="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-700 font-semibold text-sm hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed transition flex items-center gap-2">
                                    <i class="fa-solid fa-chevron-left"></i>
                                    <span>Oldingi</span>
                                </button>

                                ${q.id < questions.length ? `
                                    <button onclick="app.navigateQuestion(${q.id + 1})"
                                        class="px-5 py-2.5 rounded-xl bg-slate-900 text-white font-semibold text-sm hover:bg-slate-800 transition flex items-center gap-2">
                                        <span>Keyingi</span>
                                        <i class="fa-solid fa-chevron-right"></i>
                                    </button>
                                ` : `
                                    <button onclick="app.confirmFinishExam()"
                                        class="px-5 py-2.5 rounded-xl bg-emerald-600 text-white font-semibold text-sm hover:bg-emerald-700 transition flex items-center gap-2">
                                        <span>Imtihonni yakunlash</span>
                                        <i class="fa-solid fa-check"></i>
                                    </button>
                                `}
                            </div>
                        </div>

                        <!-- Savollar Navigatsiya Xaritasi -->
                        <div class="lg:col-span-4 bg-white rounded-3xl p-5 border border-slate-200 shadow-sm">
                            <div class="flex items-center justify-between mb-3">
                                <h3 class="font-bold text-slate-900 text-sm">Savollar xaritasi</h3>
                                <div class="flex items-center gap-2 text-[11px] text-slate-500">
                                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-emerald-500 inline-block"></span>Ishlangan</span>
                                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-blue-700 inline-block"></span>Joriy</span>
                                </div>
                            </div>

                            <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-2">1–35: Yopiq testlar</div>
                            <div class="grid grid-cols-7 gap-1.5 mb-4">
                                ${questions.filter(item => item.type === 'closed').map(item => this.renderNavCell(item, session)).join('')}
                            </div>

                            <div class="text-[11px] font-semibold text-indigo-600 uppercase tracking-wider mb-2 flex items-center justify-between">
                                <span>36–45: Yozma (a, b)</span>
                                <span class="text-[10px] bg-indigo-50 px-1.5 py-0.5 rounded">20 birlik</span>
                            </div>
                            <div class="grid grid-cols-5 gap-1.5">
                                ${questions.filter(item => item.type === 'open').map(item => this.renderNavCell(item, session)).join('')}
                            </div>
                        </div>
                    </div>
                </div>
                `;
            },

            renderNavCell(item, session) {
                const isCurrent = this.state.currentExamQuestion === item.id;
                const ans = session.answers[item.id];
                let isDone = false;
                if (item.type === 'closed') {
                    isDone = Boolean(ans);
                } else {
                    isDone = Boolean(ans && ((ans.a && ans.a.trim()) || (ans.b && ans.b.trim())));
                }

                let classes = "h-9 rounded-lg font-bold text-xs transition flex items-center justify-center border ";
                if (isCurrent) {
                    classes += "bg-blue-700 text-white border-blue-700 ring-2 ring-blue-700/30";
                } else if (isDone) {
                    classes += "bg-emerald-500 text-white border-emerald-500 hover:bg-emerald-600";
                } else if (item.type === 'open') {
                    classes += "bg-indigo-50/70 text-indigo-700 border-indigo-200 hover:bg-indigo-100";
                } else {
                    classes += "bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100";
                }

                return `<button onclick="app.navigateQuestion(${item.id})" class="${classes}">${item.id}</button>`;
            },

            navigateQuestion(id) {
                if (id < 1 || id > this.state.questions.length) return;
                this.state.currentExamQuestion = id;
                this.render();
            },

            selectClosedOption(qId, option) {
                const session = this.getActiveSession();
                if (!session) return;
                session.answers[qId] = option;
                this.saveActiveSession(session);
                this.render();
            },

            inputOpenAnswer(qId, part, value) {
                const session = this.getActiveSession();
                if (!session) return;
                if (!session.answers[qId] || typeof session.answers[qId] !== 'object') {
                    session.answers[qId] = { a: '', b: '' };
                }
                session.answers[qId][part] = value;
                this.saveActiveSession(session);

                const navButtons = document.querySelectorAll(`button[onclick="app.navigateQuestion(${qId})"]`);
                navButtons.forEach(btn => {
                    if (this.state.currentExamQuestion !== qId) {
                        const hasVal = (session.answers[qId].a && session.answers[qId].a.trim()) || (session.answers[qId].b && session.answers[qId].b.trim());
                        if (hasVal) {
                            btn.className = "h-9 rounded-lg font-bold text-xs transition flex items-center justify-center border bg-emerald-500 text-white border-emerald-500";
                        }
                    }
                });
            },

            startTimer() {
                this.stopTimer();
                const update = () => {
                    const session = this.getActiveSession();
                    if (!session) return;
                    const remaining = session.endTime - Date.now();
                    const timerText = document.getElementById('exam-timer-text');
                    const timerBox = document.getElementById('exam-timer-box');
                    if (!timerText) return;

                    if (remaining <= 0) {
                        timerText.textContent = "00:00:00";
                        this.stopTimer();
                        this.toast("Vaqt tugadi! Javoblaringiz avtomatik yakunlandi.", "warning");
                        this.finishExam(true);
                        return;
                    }

                    const totalSec = Math.floor(remaining / 1000);
                    const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
                    const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
                    const s = String(totalSec % 60).padStart(2, '0');
                    timerText.textContent = `${h}:${m}:${s}`;

                    if (totalSec < 300 && timerBox) {
                        timerBox.classList.remove('bg-slate-900');
                        timerBox.classList.add('bg-rose-600', 'animate-pulse');
                    }
                };
                update();
                this.state.timerInterval = setInterval(update, 1000);
            },

            stopTimer() {
                if (this.state.timerInterval) {
                    clearInterval(this.state.timerInterval);
                    this.state.timerInterval = null;
                }
            },

            confirmFinishExam() {
                this.confirm(
                    "Imtihonni yakunlash",
                    "Barcha javoblaringiz tekshiriladi, Rasch balli hisoblanadi va natijangiz Ustoz Islomga yuboriladi. Yakunlaysizmi?",
                    () => this.finishExam(false)
                );
            },

            async finishExam(auto = false) {
                this.stopTimer();
                const session = this.getActiveSession();
                if (!session) return;

                const timeSpentSec = Math.max(1, Math.round((Date.now() - session.startTime) / 1000));
                const now = new Date();
                const formattedDate = `${String(now.getDate()).padStart(2, '0')}.${String(now.getMonth() + 1).padStart(2, '0')}.${now.getFullYear()}`;
                const formattedDateTime = `${formattedDate} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                const certId = `MOC-${now.getFullYear()}-${Math.floor(1000 + Math.random() * 9000)}`;

                const evaluated = RaschEngine.evaluateSingle(this.state.questions, {
                    id: 'sub_' + Date.now(),
                    certId,
                    studentName: session.studentName,
                    studentGroup: session.studentGroup,
                    formattedDate,
                    formattedDateTime,
                    timeSpentSec,
                    answers: session.answers
                });

                const subs = this.getSubmissions();
                subs.push(evaluated);
                this.saveSubmissions(subs);
                this.saveActiveSession(null);

                this.state.currentResult = evaluated;
                this.state.telegramStatus = { sending: true };
                this.state.view = 'result';
                this.render();

                if (!auto) {
                    this.toast("Imtihon yakunlandi! Sertifikatingiz tayyor.", "success");
                }

                const cfg = this.getConfig();
                const tgRes = await TelegramNotifier.sendResult(cfg, evaluated);
                this.state.telegramStatus = { sending: false, ...tgRes };
                const statusBadge = document.getElementById('tg-delivery-status');
                if (statusBadge) {
                    if (tgRes.sent) {
                        statusBadge.innerHTML = `<span class="inline-flex items-center gap-1.5 text-emerald-700 bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-full text-xs font-semibold"><i class="fa-brands fa-telegram"></i> Natija Ustoz Islomning Telegramiga yuborildi</span>`;
                    } else if (cfg.telegramBotToken) {
                        statusBadge.innerHTML = `<span class="inline-flex items-center gap-1.5 text-amber-700 bg-amber-50 border border-amber-200 px-3 py-1 rounded-full text-xs font-semibold"><i class="fa-solid fa-triangle-exclamation"></i> Telegramga yuborishda xatolik</span>`;
                    }
                }
            },

            /**
             * ====================================================================
             * C) NATIJALAR VA SERTIFIKAT OYNASI
             * ====================================================================
             */
            renderResultView() {
                const r = this.state.currentResult;
                if (!r) {
                    this.state.view = 'home';
                    return this.renderHomeView();
                }

                const isPart = r.grade.isParticipation;

                return `
                <div class="space-y-6 fade-in">
                    <!-- Asosiy Natija Kartochkasi -->
                    <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-slate-100">
                            <div>
                                <div class="text-xs font-bold text-blue-700 uppercase tracking-wider mb-1">Imtihon Yakuniy Natijasi</div>
                                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">${this.escapeHtml(r.studentName)}</h1>
                                <div class="flex flex-wrap items-center gap-2 mt-1.5">
                                    <span class="text-sm text-slate-500">${this.escapeHtml(r.studentGroup)} • ${r.formattedDateTime}</span>
                                    <span id="tg-delivery-status">
                                        ${this.state.telegramStatus?.sending ? `<span class="text-xs text-blue-600"><i class="fa-solid fa-spinner fa-spin mr-1"></i>Telegramga yuborilmoqda...</span>` : ''}
                                    </span>
                                </div>
                            </div>
                            <button onclick="app.goHome()" class="self-start px-4 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-semibold hover:bg-slate-800 transition flex items-center gap-2">
                                <i class="fa-solid fa-rotate-right"></i>
                                <span>Qayta topshirish</span>
                            </button>
                        </div>

                        <!-- 4 ta Asosiy Ko'rsatkich -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-6">
                            <div class="bg-gradient-to-br from-blue-700 to-indigo-800 rounded-2xl p-5 text-white shadow-md">
                                <div class="text-xs font-medium text-blue-100 mb-1">Rasch (Rash) Balli</div>
                                <div class="text-3xl font-extrabold">${r.raschScore} <span class="text-base font-normal text-blue-200">/ 100</span></div>
                                <div class="text-xs text-blue-100 mt-2">T-ball: <strong>${r.tScore}</strong> • $\theta$ = <strong>${r.theta}</strong></div>
                            </div>

                            <div class="bg-slate-50 rounded-2xl p-5 border border-slate-200/80">
                                <div class="text-xs font-medium text-slate-500 mb-1">Sertifikat Darajasi</div>
                                <div class="text-2xl font-extrabold ${!isPart ? 'text-emerald-700' : 'text-blue-700'} mt-0.5">
                                    ${r.grade.level}
                                </div>
                                <div class="text-xs text-slate-600 mt-2">${r.grade.desc}</div>
                            </div>

                            <div class="bg-slate-50 rounded-2xl p-5 border border-slate-200/80">
                                <div class="text-xs font-medium text-slate-500 mb-1">Jami To'g'ri Javoblar</div>
                                <div class="text-3xl font-extrabold text-slate-900">${r.rawScore} <span class="text-base font-normal text-slate-400">/ ${r.maxRawScore}</span></div>
                                <div class="text-xs text-slate-500 mt-2">Yopiq: ${r.closedCorrect}/35 • Yozma: ${r.openCorrect}/20</div>
                            </div>

                            <div class="bg-slate-50 rounded-2xl p-5 border border-slate-200/80">
                                <div class="text-xs font-medium text-slate-500 mb-1">Sarflangan Vaqt</div>
                                <div class="text-3xl font-extrabold text-slate-900">${Math.floor(r.timeSpentSec / 60)} <span class="text-base font-normal text-slate-400">daq</span></div>
                                <div class="text-xs text-slate-500 mt-2">${r.timeSpentSec % 60} soniya</div>
                            </div>
                        </div>
                    </div>

                    <!-- SERTIFIKAT OYNASI (HAR DOIM KO'RINADI VA YUKLAB OLINADI) -->
                    <div class="bg-gradient-to-b ${isPart ? 'from-blue-50/80 to-white border-blue-200' : 'from-amber-50/80 to-white border-amber-200'} rounded-3xl p-6 sm:p-8 border-2 shadow-md space-y-5">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 rounded-2xl ${isPart ? 'bg-blue-600' : 'bg-amber-500'} text-white flex items-center justify-center text-2xl shadow">
                                    <i class="fa-solid fa-award"></i>
                                </div>
                                <div>
                                    <h2 class="text-xl font-extrabold text-slate-900">
                                        ${isPart
                                            ? "Imtihonda faol qatnashganingiz uchun Ishtirokchi Sertifikati!"
                                            : `Tabriklaymiz! Siz ${r.grade.level} darajali Sertifikatga loyiq ko'rildingiz!`
                                        }
                                    </h2>
                                    <p class="text-xs sm:text-sm text-slate-600">Sertifikatni yuqori sifatli PNG rasm shaklida yuklab oling.</p>
                                </div>
                            </div>
                            <button onclick="app.downloadCertificatePNG()"
                                class="px-6 py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-600 hover:to-yellow-700 text-slate-950 font-extrabold text-sm shadow-lg transition flex items-center justify-center gap-2 shrink-0">
                                <i class="fa-solid fa-download"></i>
                                <span>Sertifikatni yuklab olish (PNG)</span>
                            </button>
                        </div>

                        <div class="overflow-hidden rounded-2xl border border-slate-300 shadow-inner bg-slate-100">
                            <canvas id="certificate-canvas" class="w-full h-auto block"></canvas>
                        </div>
                    </div>

                    <!-- Savollar Bo'yicha Batafsil Tahlil -->
                    <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm">
                        <h2 class="text-lg font-bold text-slate-900 mb-4">Topshiriqlar tahlili (${r.maxRawScore} ta birlik)</h2>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="border-b border-slate-200 text-xs uppercase text-slate-500 bg-slate-50">
                                        <th class="py-3 px-4 rounded-tl-xl">Topshiriq</th>
                                        <th class="py-3 px-4">Holati</th>
                                        <th class="py-3 px-4">Sizning javobingiz</th>
                                        <th class="py-3 px-4">To'g'ri javob</th>
                                        <th class="py-3 px-4 rounded-tr-xl">Qiyinlik ($\beta_i$)</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${r.items.map(it => `
                                        <tr class="hover:bg-slate-50/80">
                                            <td class="py-2.5 px-4 font-bold text-slate-800">${it.code}</td>
                                            <td class="py-2.5 px-4">
                                                ${it.correct
                                                    ? '<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700"><i class="fa-solid fa-check"></i> To\'g\'ri</span>'
                                                    : '<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-100 text-rose-700"><i class="fa-solid fa-xmark"></i> Xato</span>'
                                                }
                                            </td>
                                            <td class="py-2.5 px-4 font-medium text-slate-700">${this.escapeHtml(it.studentVal)}</td>
                                            <td class="py-2.5 px-4 font-semibold text-emerald-700">${this.escapeHtml(it.correctVal)}</td>
                                            <td class="py-2.5 px-4 font-mono text-xs text-slate-500">${it.beta > 0 ? '+' + it.beta : it.beta}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                `;
            },

            drawCertificateIfEligible() {
                const r = this.state.currentResult;
                if (!r) return;
                const canvas = document.getElementById('certificate-canvas');
                if (canvas) {
                    CertificateGenerator.drawToCanvas(canvas, r);
                }
            },

            downloadCertificatePNG() {
                const canvas = document.getElementById('certificate-canvas');
                const r = this.state.currentResult;
                if (!canvas || !r) return;
                try {
                    const link = document.createElement('a');
                    const safeName = r.studentName.replace(/[^a-zA-Z0-9_\u0400-\u04FF]+/g, '_');
                    link.download = `Sertifikat_${safeName}_${r.grade.level}.png`;
                    link.href = canvas.toDataURL('image/png');
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    this.toast("Sertifikat PNG formatida yuklab olindi!", "success");
                } catch (err) {
                    this.toast("Yuklab olishda xatolik: rasm ustiga bosib saqlab oling.", "warning");
                }
            },

            /**
             * ====================================================================
             * D) O'QITUVCHI SOZLAMALAR PANELI
             * ====================================================================
             */
            renderTeacherAuthView() {
                return `
                <div class="max-w-md mx-auto my-8 bg-white rounded-3xl p-8 border border-slate-200 shadow-lg fade-in">
                    <div class="w-14 h-14 rounded-2xl bg-slate-900 text-white flex items-center justify-center text-2xl mx-auto mb-4 shadow-md">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <h2 class="text-xl font-extrabold text-center text-slate-900 mb-1">Ustoz Islom — Sozlamalar</h2>
                    <p class="text-xs text-center text-slate-500 mb-6">
                        Google Sheets va Telegram botni ulash uchun PIN-kodni kiriting (standart: <code>1234</code>).
                    </p>

                    <form onsubmit="app.verifyTeacherPin(event)" class="space-y-4">
                        <input type="password" id="teacher-pin-input" required autofocus placeholder="PIN-kod..."
                            class="w-full px-4 py-3.5 text-center tracking-widest font-bold text-lg rounded-xl border border-slate-300 focus:border-blue-600 outline-none">
                        <button type="submit" class="w-full py-3 rounded-xl bg-slate-900 text-white font-bold hover:bg-slate-800 transition shadow-sm">
                            Kirish
                        </button>
                    </form>
                </div>
                `;
            },

            verifyTeacherPin(e) {
                e.preventDefault();
                const input = document.getElementById('teacher-pin-input').value.trim();
                const cfg = this.getConfig();
                if (input === cfg.teacherPin) {
                    this.state.teacherAuthenticated = true;
                    this.state.view = 'teacher';
                    this.render();
                } else {
                    this.toast("Noto'g'ri PIN-kod!", "error");
                }
            },

            renderTeacherView() {
                const cfg = this.getConfig();
                const subs = this.getSubmissions();

                return `
                <div class="space-y-6 fade-in">
                    <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-slate-100">
                            <div>
                                <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900">Google Sheets va Telegram Integratsiyasi</h1>
                                <p class="text-xs sm:text-sm text-slate-500 mt-0.5">23-maktab • Ustoz Islom uchun boshqaruv markazi</p>
                            </div>
                            <button onclick="app.downloadSampleCSV()"
                                class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold transition shadow-sm flex items-center gap-2 self-start">
                                <i class="fa-solid fa-file-csv"></i>
                                <span>Namuna Google Sheets jadvalini yuklash (.csv)</span>
                            </button>
                        </div>

                        <form onsubmit="app.saveTeacherConfig(event)" class="space-y-6 mt-6">
                            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200/80 space-y-3">
                                <div class="flex items-center justify-between">
                                    <label class="text-sm font-extrabold text-slate-900 flex items-center gap-2">
                                        <i class="fa-solid fa-table text-emerald-600"></i>
                                        <span>1. Google Sheets (CSV) havolasi</span>
                                    </label>
                                    <span class="text-[11px] font-semibold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded">Chizmalar (L ustun) qo'llab-quvvatlanadi</span>
                                </div>
                                <input type="url" id="cfg-sheet-url" value="${this.escapeHtml(cfg.googleSheetCsvUrl)}"
                                    placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv"
                                    class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-white focus:border-blue-600 outline-none text-sm font-mono">
                                <p class="text-xs text-slate-500 leading-relaxed">
                                    <strong>Chizma qo'shish uchun:</strong> Google Sheets jadvalining <strong>L ustuniga</strong> (12-ustun) rasm havolasini (Google Drive yoki GitHub rasm linkini) yozing.
                                </p>
                            </div>

                            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200/80 space-y-4">
                                <div class="flex items-center justify-between">
                                    <label class="text-sm font-extrabold text-slate-900 flex items-center gap-2">
                                        <i class="fa-brands fa-telegram text-sky-500 text-lg"></i>
                                        <span>2. Telegram Bot (Natijalarni qabul qilish)</span>
                                    </label>
                                    <button type="button" onclick="app.sendTestTelegram()"
                                        class="px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold transition">
                                        Test xabar yuborish
                                    </button>
                                </div>

                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-bold text-slate-700 mb-1">Bot Token (@BotFather dan)</label>
                                        <input type="text" id="cfg-tg-token" value="${this.escapeHtml(cfg.telegramBotToken)}"
                                            placeholder="7123456789:AAHdqTcvCH1vGWJxfSeofSAs0K5PALDsaw"
                                            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-sm font-mono outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-slate-700 mb-1">Sizning Chat ID (@userinfobot dan)</label>
                                        <input type="text" id="cfg-tg-chat" value="${this.escapeHtml(cfg.telegramChatId)}"
                                            placeholder="123456789"
                                            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-sm font-mono outline-none">
                                    </div>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div class="sm:col-span-1">
                                    <label class="block text-xs font-bold text-slate-700 mb-1">Imtihon vaqti (daqiqa)</label>
                                    <input type="number" id="cfg-duration" min="5" max="300" value="${cfg.durationMinutes}"
                                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-bold outline-none">
                                </div>
                                <div class="sm:col-span-1">
                                    <label class="block text-xs font-bold text-slate-700 mb-1">Yangi PIN-kod</label>
                                    <input type="text" id="cfg-pin" minlength="4" value="${this.escapeHtml(cfg.teacherPin)}"
                                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-mono font-bold outline-none">
                                </div>
                                <div class="sm:col-span-1">
                                    <label class="block text-xs font-bold text-slate-700 mb-1">Imtihon sarlavhasi</label>
                                    <input type="text" id="cfg-title" value="${this.escapeHtml(cfg.examTitle)}"
                                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm outline-none">
                                </div>
                            </div>

                            <div class="flex flex-wrap items-center justify-between gap-3 pt-4 border-t border-slate-100">
                                <button type="submit" class="px-6 py-3 rounded-xl bg-blue-700 hover:bg-blue-800 text-white font-bold text-sm transition shadow-md">
                                    Sozlamalarni saqlash va Savollarni yuklash
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- O'QUVCHILARGA ULASHISH HAVOLASI -->
                    <div class="bg-gradient-to-r from-indigo-900 to-slate-900 rounded-3xl p-6 sm:p-8 text-white shadow-lg space-y-4">
                        <div class="flex items-start gap-3">
                            <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-amber-300 shrink-0">
                                <i class="fa-solid fa-link"></i>
                            </div>
                            <div>
                                <h2 class="text-lg font-extrabold">O'quvchilarga yuborish uchun Tayyor Havola (Ssilka)</h2>
                                <p class="text-xs text-slate-300 mt-0.5 leading-relaxed">
                                    Sozlamalarni saqlaganingizdan so'ng quyidagi havolani nusxalab o'quvchilarga yuboring.
                                </p>
                            </div>
                        </div>

                        <div class="flex flex-col sm:flex-row gap-2">
                            <input type="text" id="shareable-student-link" readonly value="${this.escapeHtml(this.generateShareableLink())}"
                                class="flex-1 px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-xs font-mono text-blue-200 outline-none">
                            <button type="button" onclick="app.copyShareableLink()"
                                class="px-5 py-3 rounded-xl bg-amber-400 hover:bg-amber-500 text-slate-950 font-extrabold text-xs sm:text-sm transition shrink-0">
                                <i class="fa-solid fa-copy mr-1.5"></i>Havolani nusxalash
                            </button>
                        </div>
                    </div>
                </div>
                `;
            },

            async saveTeacherConfig(e) {
                e.preventDefault();
                const cfg = this.getConfig();
                cfg.googleSheetCsvUrl = document.getElementById('cfg-sheet-url').value.trim();
                cfg.telegramBotToken = document.getElementById('cfg-tg-token').value.trim();
                cfg.telegramChatId = document.getElementById('cfg-tg-chat').value.trim();
                cfg.durationMinutes = parseInt(document.getElementById('cfg-duration').value, 10) || 150;
                cfg.teacherPin = document.getElementById('cfg-pin').value.trim() || "1234";
                cfg.examTitle = document.getElementById('cfg-title').value.trim() || DEFAULT_CONFIG.examTitle;

                this.saveConfig(cfg);
                await this.loadQuestions(true);
                this.render();
            },

            async sendTestTelegram() {
                const token = document.getElementById('cfg-tg-token').value.trim();
                const chatId = document.getElementById('cfg-tg-chat').value.trim();
                if (!token || !chatId) {
                    this.toast("Avval Bot Token va Chat ID ni kiriting!", "warning");
                    return;
                }

                this.toast("Test xabar yuborilmoqda...", "info");
                const res = await TelegramNotifier.sendResult(
                    { telegramBotToken: token, telegramChatId: chatId },
                    {
                        studentName: "Test O'quvchi (Sinov)",
                        studentGroup: "11-A sinf",
                        formattedDateTime: new Date().toLocaleString('uz-UZ'),
                        timeSpentSec: 3600,
                        closedCorrect: 30,
                        openCorrect: 16,
                        rawScore: 46,
                        maxRawScore: 55,
                        raschScore: 71.25,
                        theta: 1.3,
                        certId: "MOC-2026-TEST",
                        grade: { eligible: true, isParticipation: false, level: "A+" }
                    }
                );

                if (res.sent) {
                    this.toast("Ajoyib! Telegram botingizga test xabar muvaffaqiyatli bordi!", "success");
                } else {
                    this.toast(`Xatolik: ${res.error || "Botga yuborib bo'lmadi"}`, "error");
                }
            },

            generateShareableLink() {
                const cfg = this.getConfig();
                const payload = {
                    s: cfg.googleSheetCsvUrl,
                    t: cfg.telegramBotToken,
                    c: cfg.telegramChatId,
                    d: cfg.durationMinutes,
                    title: cfg.examTitle
                };
                const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
                const baseUrl = window.location.href.split('?')[0];
                return `${baseUrl}?cfg=${encoded}`;
            },

            copyShareableLink() {
                const input = document.getElementById('shareable-student-link');
                if (!input) return;
                input.select();
                input.setSelectionRange(0, 99999);
                try {
                    document.execCommand('copy');
                    this.toast("O'quvchilar uchun havola nusxalandi!", "success");
                } catch (e) {
                    this.toast("Havolani qo'lda belgilab nusxalang.", "warning");
                }
            },

            downloadSampleCSV() {
                const csv = GoogleSheetsLoader.generateSampleCSV();
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'MOC_Savollar_Namuna_Ustoz_Islom.csv';
                link.click();
                URL.revokeObjectURL(url);
                this.toast("Namuna CSV fayl yuklab olindi!", "success");
            },

            escapeHtml(str) {
                if (str === null || str === undefined) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
