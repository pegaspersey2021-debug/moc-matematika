    <script>
        /**

        const DEFAULT_CONFIG = {
            examTitle: "Matematika fanidan Milliy Sertifikat (MOC) sinov imtihoni",
            durationMinutes: 150,
            teacherPin: "1234",

        function getFallbackQuestions() {
            const list = [];
            const closedBank = [
                { t: "Hisoblang: $\\frac{3}{4} + \\frac{5}{6} - \\frac{7}{12}$", o: { A: "$1$", B: "$\\frac{5}{6}$", C: "$\\frac{11}{12}$", D: "$1\\frac{1}{6}$" }, c: "A", img: "" },
                { t: "Tenglamani yeching: $4(x - 3) = 2x + 6$", o: { A: "$6$", B: "$9$", C: "$3$", D: "$12$" }, c: "B", img: "" },
                { t: "$35\\%$ i $70$ ga teng bo'lgan sonning $60\\%$ ini toping.", o: { A: "$100$", B: "$140$", C: "$120$", D: "$150$" }, c: "C", img: "" },
                { t: "To'g'ri burchakli uchburchakning katetlari $6\\text{ sm}$ va $8\\text{ sm}$ bo'lsa, gipotenuzasini toping.", o: { A: "$14\\text{ sm}$", B: "$12\\text{ sm}$", C: "$10\\text{ sm}$", D: "$48\\text{ sm}$" }, c: "C", img: "" },
                { t: "Ifodani soddalashtiring: $(2a - 3)^2 - 4a^2 + 12a$", o: { A: "$-9$", B: "$9$", C: "$6$", D: "$9 - 24a$" }, c: "B", img: "" },
                { t: "Arifmetik progressiyada $a_1 = 5$ va $d = 4$ bo'lsa, dastlabki $10$ ta hadining yig'indisini ($S_{10}$) toping.", o: { A: "$230$", B: "$210$", C: "$250$", D: "$190$" }, c: "A", img: "" },
                { t: "$x^2 - 9x + 14 = 0$ kvadrat tenglama ildizlari ko'paytmasini toping.", o: { A: "$9$", B: "$-14$", C: "$14$", D: "$-9$" }, c: "C", img: "" },
                { t: "Hisoblang: $\\log_3 81 + \\log_2 16 - \\log_5 25$", o: { A: "$5$", B: "$6$", C: "$7$", D: "$8$" }, c: "B", img: "" },
                { t: "Aylana radiusi $R = 7\\text{ sm}$ bo'lsa, uning uzunligini toping ($\\pi \\approx \\frac{22}{7}$).", o: { A: "$22\\text{ sm}$", B: "$154\\text{ sm}$", C: "$44\\text{ sm}$", D: "$14\\text{ sm}$" }, c: "C", img: "" },
                { t: "$f(x) = 2x^3 - 5x^2 + 7x - 1$ funksiyaning $x_0 = 1$ nuqtadagi hosilasini toping.", o: { A: "$3$", B: "$4$", C: "$2$", D: "$5$" }, c: "A", img: "" }
            ];

            for (let i = 1; i <= 35; i++) {
                const item = closedBank[(i - 1) % closedBank.length];
                const block = Math.floor((i - 1) / 10) + 1;
                list.push({
                    id: i,
                    type: 'closed',
                    text: i <= 10 ? item.t : `(${block}-bosqich) Quyidagi topshiriqni bajaring: ${item.t}`,
                    imageUrl: item.img || '',
                    options: { ...item.o },
                    correctA: item.c,
                    correctB: '',
                    baseDifficulty: Number((-1.5 + ((i - 1) / 34) * 2.5).toFixed(2))
                });
            }

            const openBank = [
                {
                    text: "$f(x) = x^2 - 6x + 5$ kvadrat funksiya berilgan.",
                    pA: "a) $f(x) = 0$ tenglamaning katta ildizini toping.", aA: "5",
                    pB: "b) Parabola uchining ordinatasini ($y_0$) toping.", aB: "-4"
                },
                {
                    text: "Geometrik progressiyada $b_1 = 3$ va maxraj $q = 2$ ga teng.",
                    pA: "a) Progressiyaning $5$-hadini ($b_5$) toping.", aA: "48",
                    pB: "b) Dastlabki $4$ ta hadining yig'indisini ($S_4$) toping.", aB: "45"
                },
                {
                    text: "To'g'ri to'rtburchakning perimetri $34\\text{ sm}$, diagonali esa $13\\text{ sm}$ ga teng.",
                    pA: "a) To'g'ri to'rtburchakning yuzini ($\\text{sm}^2$) toping.", aA: "60",
                    pB: "b) Katta tomoni uzunligini ($\\text{sm}$) toping.", aB: "12"
                },
                {
                    text: "$\\frac{2x - 1}{3} + \\frac{x + 2}{2} = 4$ tenglama berilgan.",
                    pA: "a) Tenglamaning ildizini toping.", aA: "2",
                    pB: "b) Topilgan ildizning kvadratidan $1$ ni ayiring.", aB: "3"
                },
                {
                    text: "Qutida $4$ ta oq va $6$ ta qora shar bor.",
                    pA: "a) Tavakkaliga olingan bitta sharning oq bo'lish ehtimolini o'nli kasrda yozing.", aA: "0.4",
                    pB: "b) Tavakkaliga olingan bitta sharning qora bo'lish ehtimolini o'nli kasrda yozing.", aB: "0.6"
                }
            ];

            for (let i = 36; i <= 45; i++) {
                const ob = openBank[(i - 36) % openBank.length];
                const idx = i - 35;
                list.push({
                    id: i,
                    type: 'open',
                    text: `[${i}-topshiriq] ${ob.text}`,
                    imageUrl: '',
                    options: { A: '', B: '', C: '', D: '' },
                    partAPrompt: ob.pA,
                    correctA: ob.aA,
                    partBPrompt: ob.pB,
                    correctB: ob.aB,
                    baseDifficultyA: Number((0.5 + idx * 0.14).toFixed(2)),
                    baseDifficultyB: Number((0.8 + idx * 0.14).toFixed(2))
                });
            }

            return list;
        }

        /**
         * ============================================================================
         * 2. GOOGLE SHEETS CSV PARSER VA YUKLOVCHI (CHIZMALARNI QO'LLAB-QUVVATLAYDI)
         * ============================================================================
         */
        class GoogleSheetsLoader {
            // Google Sheets'da ikkilanib qolgan \\frac kabi belgilarni tozalash
            static cleanLatex(str) {
                if (!str) return '';
                return String(str).replace(/\\\\([a-zA-Z]+)/g, '\\$1');
            }

            // Google Drive yoki oddiy rasm havolasini to'g'ridan-to'g'ri rasm ko'rsatuvchi URL ga o'tkazish
            static normalizeImageUrl(url) {
                if (!url) return '';
                const clean = String(url).trim();
                if (!clean) return '';

                // Google Drive linkini (drive.google.com/file/d/ID/view) to'g'ridan-to'g'ri rasmga aylantirish
                const gdriveMatch = clean.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
                if (gdriveMatch && gdriveMatch[1]) {
                    return `https://lh3.googleusercontent.com/d/${gdriveMatch[1]}`;
                }
                const gdriveOpenMatch = clean.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);
                if (gdriveOpenMatch && gdriveOpenMatch[1]) {
                    return `https://lh3.googleusercontent.com/d/${gdriveOpenMatch[1]}`;
                }

                return clean;
            }

            static parseCSV(csvText) {
                const rows = [];
                let currentRow = [];
                let currentCell = '';
                let insideQuotes = false;

                for (let i = 0; i < csvText.length; i++) {
                    const char = csvText[i];
                    const nextChar = csvText[i + 1];

                    if (char === '"') {
                        if (insideQuotes && nextChar === '"') {
                            currentCell += '"';
                            i++;
                        } else {
                            insideQuotes = !insideQuotes;
                        }
                    } else if (char === ',' && !insideQuotes) {
                        currentRow.push(currentCell.trim());
                        currentCell = '';
                    } else if ((char === '\r' || char === '\n') && !insideQuotes) {
                        if (char === '\r' && nextChar === '\n') i++;
                        currentRow.push(currentCell.trim());
                        if (currentRow.some(c => c !== '')) rows.push(currentRow);
                        currentRow = [];
                        currentCell = '';
                    } else {
                        currentCell += char;
                    }
                }
                if (currentCell !== '' || currentRow.length > 0) {
                    currentRow.push(currentCell.trim());
                    if (currentRow.some(c => c !== '')) rows.push(currentRow);
                }
                return rows;
            }

            static async fetchFromUrl(csvUrl) {
                if (!csvUrl || !csvUrl.startsWith('http')) {
                    throw new Error("Google Sheets CSV havolasi kiritilmagan.");
                }

                const separator = csvUrl.includes('?') ? '&' : '?';
                const response = await fetch(`${csvUrl}${separator}_t=${Date.now()}`);
                if (!response.ok) {
                    throw new Error(`Google Sheets javob bermadi (HTTP ${response.status})`);
                }

                const text = await response.text();
                const rows = this.parseCSV(text);
                if (rows.length < 1) {
                    throw new Error("Jadval bo'sh yoki noto'g'ri formatda.");
                }

                const questions = [];
                let customDuration = null;
                let customTitle = null;

                // 1-qator sarlavha bo'lsa tashlab ketamiz, agar darhol 1-savol yozilgan bo'lsa uni ham o'qiymiz!
                const firstCellNum = parseInt(rows[0][0], 10);
                const startRow = (!isNaN(firstCellNum) && firstCellNum >= 1) ? 0 : 1;

                for (let r = startRow; r < rows.length; r++) {
                    const cols = rows[r];
                    const qNum = parseInt(cols[0], 10);
                    if (isNaN(qNum) || qNum < 1 || qNum > 45) continue;

                    const rawType = (cols[1] || '').toLowerCase();
                    const isOpen = qNum >= 36 || rawType.includes('yozma') || rawType.includes('ochiq');

                    if (cols[9] && !isNaN(parseInt(cols[9], 10)) && !customDuration) {
                        customDuration = parseInt(cols[9], 10);
                    }
                    if (cols[10] && cols[10].trim() && !customTitle) {
                        customTitle = cols[10].trim();
                    }

                    // L ustuni (index 11) - Chizma / Rasm havolasi
                    const imageUrl = this.normalizeImageUrl(cols[11] || '');

                    if (!isOpen) {
                        questions.push({
                            id: qNum,
                            type: 'closed',
                            text: this.cleanLatex(cols[2] || `${qNum}-savol`),
                            imageUrl: imageUrl,
                            options: {
                                A: this.cleanLatex(cols[3] || 'A'),
                                B: this.cleanLatex(cols[4] || 'B'),
                                C: this.cleanLatex(cols[5] || 'C'),
                                D: this.cleanLatex(cols[6] || 'D')
                            },
                            correctA: (cols[7] || 'A').toUpperCase().trim(),
                            correctB: '',
                            baseDifficulty: Number((-1.5 + ((qNum - 1) / 34) * 2.5).toFixed(2))
                        });
                    } else {
                        const idx = qNum - 35;
                        questions.push({
                            id: qNum,
                            type: 'open',
                            text: this.cleanLatex(cols[2] || `${qNum}-yozma topshiriq`),
                            imageUrl: imageUrl,
                            options: { A: '', B: '', C: '', D: '' },
                            partAPrompt: this.cleanLatex(cols[3] || 'a) shart javobini kiriting:'),
                            partBPrompt: this.cleanLatex(cols[4] || 'b) shart javobini kiriting:'),
                            correctA: (cols[7] || '').trim(),
                            correctB: (cols[8] || '').trim(),
                            baseDifficultyA: Number((0.5 + idx * 0.14).toFixed(2)),
                            baseDifficultyB: Number((0.8 + idx * 0.14).toFixed(2))
                        });
                    }
                }

                if (questions.length === 0) {
                    throw new Error("Jadvaldan savollar topilmadi. Ustun tartibini tekshiring.");
                }

                questions.sort((a, b) => a.id - b.id);
                return { questions, customDuration, customTitle };
            }

            static generateSampleCSV() {
                const headers = [
                    "Savol_raqami",
                    "Turi",
                    "Savol_matni",
                    "A_variant_yoki_A_shart",
                    "B_variant_yoki_B_shart",
                    "C_variant",
                    "D_variant",
                    "Togri_javob_A",
                    "Togri_javob_B",
                    "Vaqt_daqiqa",
                    "Imtihon_nomi",
                    "Rasm_havolasi"
                ];
                const fallback = getFallbackQuestions();
                const lines = [headers.join(',')];

                const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;

                fallback.forEach((q, i) => {
                    if (q.type === 'closed') {
                        lines.push([
                            q.id,
                            "yopiq",
                            esc(q.text),
                            esc(q.options.A),
                            esc(q.options.B),
                            esc(q.options.C),
                            esc(q.options.D),
                            esc(q.correctA),
                            "",
                            i === 0 ? "150" : "",
                            i === 0 ? esc("Matematika fanidan Milliy Sertifikat (MOC) sinov imtihoni") : "",
                            esc(q.imageUrl || "")
                        ].join(','));
                    } else {
                        lines.push([
                            q.id,
                            "yozma",
                            esc(q.text),
                            esc(q.partAPrompt),
                            esc(q.partBPrompt),
                            "",
                            "",
                            esc(q.correctA),
                            esc(q.correctB),
                            "",
                            "",
                            esc(q.imageUrl || "")
                        ].join(','));
                    }
                });

                return "\uFEFF" + lines.join('\n');
            }
        }

        /**
         * ============================================================================
         * 3. RASCH (RASH) MODELI PSIXOMETRIK BAHOLASH ALGORITMI
         * ============================================================================
         */
        class RaschEngine {
            static normalizeAnswer(val) {
                if (val === null || val === undefined) return "";
                return String(val)
                    .trim()
                    .toLowerCase()
                    .replace(/\s+/g, '')
                    .replace(/,/g, '.');
            }

            static evaluateResponseVector(questions, studentAnswers) {
                const vector = [];
                const itemDetails = [];
                let closedCorrect = 0;
                let openCorrect = 0;

                questions.forEach(q => {
                    const ans = studentAnswers[q.id];
                    if (q.type === 'closed') {
                        const isCorrect = (ans && String(ans).toUpperCase() === String(q.correctA).toUpperCase()) ? 1 : 0;
                        if (isCorrect) closedCorrect++;
                        vector.push(isCorrect);
                        itemDetails.push({
                            code: `${q.id}`,
                            qId: q.id,
                            correct: isCorrect === 1,
                            studentVal: ans || "Belgilanmagan",
                            correctVal: q.correctA,
                            beta: q.baseDifficulty ?? 0
                        });
                    } else {
                        const ansA = ans && ans.a ? ans.a : "";
                        const isCorrectA = (this.normalizeAnswer(ansA) !== "" &&
                            this.normalizeAnswer(ansA) === this.normalizeAnswer(q.correctA)) ? 1 : 0;
                        if (isCorrectA) openCorrect++;
                        vector.push(isCorrectA);
                        itemDetails.push({
                            code: `${q.id}(a)`,
                            qId: q.id,
                            correct: isCorrectA === 1,
                            studentVal: ansA || "Yozilmagan",
                            correctVal: q.correctA,
                            beta: q.baseDifficultyA ?? 1.0
                        });

                        const ansB = ans && ans.b ? ans.b : "";
                        const isCorrectB = (this.normalizeAnswer(ansB) !== "" &&
                            this.normalizeAnswer(ansB) === this.normalizeAnswer(q.correctB)) ? 1 : 0;
                        if (isCorrectB) openCorrect++;
                        vector.push(isCorrectB);
                        itemDetails.push({
                            code: `${q.id}(b)`,
                            qId: q.id,
                            correct: isCorrectB === 1,
                            studentVal: ansB || "Yozilmagan",
                            correctVal: q.correctB,
                            beta: q.baseDifficultyB ?? 1.3
                        });
                    }
                });

                return { vector, itemDetails, closedCorrect, openCorrect };
            }

            static estimateTheta(responseVector, betas) {
                const rawScore = responseVector.reduce((a, b) => a + b, 0);
                const M = betas.length;
                if (M === 0) return 0;

                const targetScore = Math.max(0.3, Math.min(M - 0.3, rawScore));
                let theta = Math.log(targetScore / (M - targetScore));

                for (let iter = 0; iter < 35; iter++) {
                    let sumP = 0;
                    let sumPQ = 0;
                    for (let i = 0; i < M; i++) {
                        const diff = Math.max(-15, Math.min(15, theta - betas[i]));
                        const p = 1 / (1 + Math.exp(-diff));
                        sumP += p;
                        sumPQ += p * (1 - p);
                    }
                    const residual = targetScore - sumP;
                    if (Math.abs(residual) < 1e-5 || sumPQ < 1e-6) break;
                    theta += residual / sumPQ;
                }

                return Math.max(-4.0, Math.min(4.0, theta));
            }

            static evaluateSingle(questions, submission) {
                const { vector, itemDetails, closedCorrect, openCorrect } = this.evaluateResponseVector(questions, submission.answers);
                const betas = itemDetails.map(d => d.beta);
                const theta = this.estimateTheta(vector, betas);
                const rawScore = vector.reduce((a, b) => a + b, 0);
                const maxRawScore = vector.length;

                const tScore = Number((50 + 10 * theta).toFixed(2));
                const raschScore = Number(Math.max(0, Math.min(100, 55 + theta * 12.5)).toFixed(2));
                const grade = this.getCertificateGrade(raschScore);

                return {
                    ...submission,
                    rawScore,
                    maxRawScore,
                    closedCorrect,
                    openCorrect,
                    theta: Number(theta.toFixed(3)),
                    tScore,
                    raschScore,
                    grade,
                    items: itemDetails
                };
            }

            static getCertificateGrade(score) {
                if (score >= 70.0) return { eligible: true, isParticipation: false, level: "A+", color: "emerald", desc: "Eng yuqori daraja (Imtiyozli)" };
                if (score >= 65.0) return { eligible: true, isParticipation: false, level: "A", color: "teal", desc: "Yuqori daraja (Imtiyozli)" };
                if (score >= 60.0) return { eligible: true, isParticipation: false, level: "B+", color: "blue", desc: "Yaxshi daraja" };
                if (score >= 55.0) return { eligible: true, isParticipation: false, level: "B", color: "indigo", desc: "Qoniqarli yuqori daraja" };
                if (score >= 50.0) return { eligible: true, isParticipation: false, level: "C+", color: "amber", desc: "O'rta daraja" };
                if (score >= 46.0) return { eligible: true, isParticipation: false, level: "C", color: "orange", desc: "Minimal o'tish darajasi" };
                // 46 balldan past bo'lganda ham o'quvchi ranjimasligi uchun "ISHTIROKCHI" sertifikati beriladi
                return { eligible: true, isParticipation: true, level: "ISHTIROKCHI", color: "slate", desc: "Sinov imtihonida faol ishtirok etdi" };
            }
        }

        class CertificateGenerator {
            static drawToCanvas(canvas, result) {
                const ctx = canvas.getContext('2d');
                const W = 1600;
                const H = 1130;
                canvas.width = W;
                canvas.height = H;

                const accentColor = isPart ? '#3b82f6' : '#d4af37';

                // 1. Asosiy fon
                const bgGrad = ctx.createLinearGradient(0, 0, W, H);
                bgGrad.addColorStop(0, '#ffffff');
                bgGrad.addColorStop(0.5, isPart ? '#f8fafc' : '#fcfaf2');
                bgGrad.addColorStop(1, isPart ? '#eff6ff' : '#f4efe1');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, W, H);

                // 2. Burchak naqshlari
                ctx.fillStyle = primaryColor;
                ctx.beginPath();
                ctx.moveTo(0, 0); ctx.lineTo(340, 0); ctx.lineTo(0, 340);
                ctx.closePath(); ctx.fill();

                ctx.beginPath();
                ctx.moveTo(W, H); ctx.lineTo(W - 340, H); ctx.lineTo(W, H - 340);
                ctx.closePath(); ctx.fill();

                ctx.fillStyle = accentColor;
                ctx.beginPath();
                ctx.moveTo(340, 0); ctx.lineTo(375, 0); ctx.lineTo(0, 375); ctx.lineTo(0, 340);
                ctx.closePath(); ctx.fill();

                ctx.beginPath();
                ctx.moveTo(W - 340, H); ctx.lineTo(W - 375, H); ctx.lineTo(W, H - 375); ctx.lineTo(W, H - 340);
                ctx.closePath(); ctx.fill();

                // 3. Ramkalar
                ctx.strokeStyle = primaryColor;
                ctx.lineWidth = 8;
                ctx.strokeRect(42, 42, W - 84, H - 84);

                ctx.strokeStyle = isPart ? '#60a5fa' : '#c59b27';
                ctx.lineWidth = 3;
                ctx.strokeRect(58, 58, W - 116, H - 116);

                // 4. Yuqori sarlavhalar

                ctx.fillStyle = primaryColor;
                ctx.font = '700 22px Inter, sans-serif';

                ctx.fillStyle = isPart ? '#2563eb' : '#8a6d1b';
                ctx.font = '600 20px Inter, sans-serif';
                ctx.fillText("23-SONLI UMUMTA'LIM MAKTABI • MILLIY SERTIFIKAT TAYYORLOV MARKAZI", W / 2, 168);

                ctx.strokeStyle = accentColor;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(W / 2 - 260, 195);
                ctx.lineTo(W / 2 + 260, 195);
                ctx.stroke();

                // 5. SERTIFIKAT sarlavhasi
                ctx.fillStyle = primaryColor;

                ctx.lineWidth = 2;

                ctx.lineTo(W / 2 + 380, 445);

                ctx.fillStyle = '#1e3a8a';

                    ctx.fillText("Milliy Sertifikat (MOC) sinov imtihonida yuqori bilim va salohiyat", W / 2, 542);
                    ctx.fillText("ko'rsatgani uchun taqdirlanadi.", W / 2, 578);
                }

                // 7. Daraja va Rasch Balli Markaziy Bloki
                const boxW = 680;
                const boxH = 175;
                const boxX = (W - boxW) / 2;
                const boxY = 615;

                ctx.fillStyle = primaryColor;
                this.roundRect(ctx, boxX, boxY, boxW, boxH, 24, true, false);
                ctx.strokeStyle = accentColor;
                ctx.lineWidth = 4;
                this.roundRect(ctx, boxX, boxY, boxW, boxH, 24, false, true);

                ctx.textAlign = 'center';
                ctx.fillStyle = isPart ? '#93c5fd' : '#facc15';
                ctx.font = isPart ? '800 32px Inter, sans-serif' : '800 76px Inter, sans-serif';

                ctx.strokeStyle = 'rgba(212, 175, 55, 0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(boxX + 305, boxY + 25);
                ctx.lineTo(boxX + 305, boxY + boxH - 25);
                ctx.stroke();

                ctx.textAlign = 'left';
                ctx.fillStyle = '#ffffff';
                ctx.font = '800 36px Inter, sans-serif';

                ctx.font = '500 18px Inter, sans-serif';
                ctx.fillText(`To'g'ri javoblar: ${result.rawScore} / ${result.maxRawScore} birlik`, boxX + 335, boxY + 138);

                // 8. Muhr
                this.drawGoldSeal(ctx, W / 2, 935, isPart ? "MOC" : result.grade.level, isPart);

                // 9. Pastki Chap
                ctx.textAlign = 'left';
                ctx.fillStyle = '#475569';
                ctx.font = '600 19px Inter, sans-serif';
                ctx.fillText(`Berilgan sana: ${result.formattedDate}`, 130, 915);
                ctx.fillStyle = primaryColor;
                ctx.font = '700 19px monospace';
                ctx.fillText(`Sertifikat ID: ${result.certId}`, 130, 952);

                // 10. Pastki O'ng
                ctx.textAlign = 'right';
                ctx.fillStyle = '#475569';
                ctx.font = '600 19px Inter, sans-serif';
                ctx.fillText("Fan o'qituvchisi:", W - 130, 905);

                ctx.fillStyle = primaryColor;
                ctx.font = '800 24px Inter, sans-serif';
                ctx.fillText("Ustoz Islom", W - 130, 942);

                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(W - 360, 956);
                ctx.lineTo(W - 130, 956);
                ctx.stroke();

                ctx.fillStyle = '#64748b';
                ctx.font = 'italic 15px Inter, sans-serif';
                ctx.fillText("23-maktab, Sayxunobod tumani", W - 130, 980);
            }

            static drawGoldSeal(ctx, cx, cy, level, isPart = false) {
                ctx.save();
                const spikes = 36;
                const outerR = 68;
                const innerR = 61;
                ctx.beginPath();
                for (let i = 0; i < spikes * 2; i++) {
                    const r = i % 2 === 0 ? outerR : innerR;
                    const angle = (Math.PI * i) / spikes;
                    const x = cx + Math.cos(angle) * r;
                    const y = cy + Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();

                const grad = ctx.createRadialGradient(cx - 15, cy - 15, 10, cx, cy, outerR);
                if (isPart) {
                    grad.addColorStop(0, '#dbeafe');
                    grad.addColorStop(0.5, '#3b82f6');
                    grad.addColorStop(1, '#1d4ed8');
                } else {
                    grad.addColorStop(0, '#fef08a');
                    grad.addColorStop(0.5, '#eab308');
                    grad.addColorStop(1, '#a16207');
                }
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(cx, cy, 48, 0, Math.PI * 2);
                ctx.strokeStyle = isPart ? '#1e3a8a' : '#713f12';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.textAlign = 'center';
                ctx.fillStyle = isPart ? '#ffffff' : '#422006';
                ctx.font = '800 13px Inter, sans-serif';
                ctx.fillText("MOC • 23-MAKTAB", cx, cy - 12);

                ctx.font = '800 24px Inter, sans-serif';
                ctx.fillText(level, cx, cy + 14);

                ctx.font = '700 10px Inter, sans-serif';
                ctx.fillText("TASDIQLANGAN", cx, cy + 30);
                ctx.restore();
            }

            static roundRect(ctx, x, y, width, height, radius, fill, stroke) {
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + width - radius, y);
                ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                ctx.lineTo(x + width, y + height - radius);
                ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                ctx.lineTo(x + radius, y + height);
                ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
                if (fill) ctx.fill();
                if (stroke) ctx.stroke();
            }
        }

        /**
         * ============================================================================
         * 5. TELEGRAM BOT INTEGRATSIYASI
         * ============================================================================
         */
        class TelegramNotifier {
            static async sendResult(config, result) {
                if (!config.telegramBotToken || !config.telegramChatId) {
                    return { sent: false, reason: "Telegram sozlanmagan" };
                }

                const statusEmoji = !result.grade.isParticipation ? "🏆" : "📝";
                const certLine = `🎖 <b>Sertifikat:</b> ${result.grade.level} (<code>${result.certId}</code>)`;

                const text = [
                    `${statusEmoji} <b>YANGI MOC IMTIHON NATIJASI</b>`,
                    `🏫 <i>23-maktab • Ustoz Islom platformasi</i>`,
                    ``,
                    `👤 <b>O'quvchi:</b> ${this.escapeHtml(result.studentName)}`,
                    `🎓 <b>Sinf / Guruh:</b> ${this.escapeHtml(result.studentGroup)}`,
                    `📅 <b>Sana va vaqt:</b> ${result.formattedDateTime}`,
                    `⏱ <b>Sarflangan vaqt:</b> ${Math.floor(result.timeSpentSec / 60)} daq ${result.timeSpentSec % 60} son`,
                    ``,
                    `✅ <b>Yopiq test (1–35):</b> ${result.closedCorrect} / 35`,
                    `✍️ <b>Yozma test (36–45 a/b):</b> ${result.openCorrect} / 20`,
                    `📊 <b>Jami to'g'ri birlik:</b> ${result.rawScore} / ${result.maxRawScore}`,
                    `📐 <b>Rasch (Rash) balli:</b> <b>${result.raschScore} ball</b> (θ = ${result.theta})`,
                    certLine
                ].join('\n');

                try {
                    const url = `https://api.telegram.org/bot${config.telegramBotToken.trim()}/sendMessage`;
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: config.telegramChatId.trim(),
                            text: text,
                            parse_mode: 'HTML'
                        })
                    });
                    const data = await res.json();
                    return { sent: data.ok === true, error: data.description };
                } catch (err) {
                    return { sent: false, error: err.message };
                }
            }

            static escapeHtml(str) {
                return String(str ?? '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
            }
        }

            applyUrlConfigIfPresent() {
                try {
                    const params = new URLSearchParams(window.location.search);
                    const encoded = params.get('cfg');
                    if (encoded) {
                        const jsonStr = decodeURIComponent(escape(atob(encoded)));
                        const shared = JSON.parse(jsonStr);
                        const current = this.getConfig();
                        const merged = {
                            ...current,
                            googleSheetCsvUrl: shared.s || current.googleSheetCsvUrl,
                            telegramBotToken: shared.t || current.telegramBotToken,
                            telegramChatId: shared.c || current.telegramChatId,
                            durationMinutes: shared.d || current.durationMinutes,
                            examTitle: shared.title || current.examTitle
                        };
                        this.saveConfig(merged);
                    }
                } catch (e) {
                    console.warn("URL konfiguratsiyani o'qishda xatolik:", e);
                }

            getConfig() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEYS.CONFIG);
                    return saved ? { ...DEFAULT_CONFIG, ...JSON.parse(saved) } : { ...DEFAULT_CONFIG };
                } catch (e) {
                    return { ...DEFAULT_CONFIG };
                }
            },

                localStorage.setItem(STORAGE_KEYS.CONFIG, JSON.stringify(cfg));
            },

                    return saved ? JSON.parse(saved) : null;

                const container = document.getElementById('toast-container');
                const colors = {
                    success: 'bg-emerald-600 text-white',
                    error: 'bg-rose-600 text-white',
                    warning: 'bg-amber-500 text-white',
                    info: 'bg-slate-800 text-white'
                };
                const icons = {
                    success: 'fa-circle-check',
                    error: 'fa-circle-xmark',
                    warning: 'fa-triangle-exclamation',
                    info: 'fa-circle-info'
                };
                const el = document.createElement('div');
                el.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg text-sm font-medium fade-in ${colors[type] || colors.info}`;
                el.innerHTML = `<i class="fa-solid ${icons[type] || icons.info}"></i><span>${message}</span>`;
                container.appendChild(el);
                setTimeout(() => {
                    el.style.opacity = '0';
                    el.style.transition = 'opacity 0.3s';
                    setTimeout(() => el.remove(), 300);
                }, 3500);

                const modal = document.getElementById('confirm-modal');
                document.getElementById('confirm-title').textContent = title;
                document.getElementById('confirm-message').textContent = message;
                modal.classList.remove('hidden');
                modal.classList.add('flex');

                const close = () => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');

                document.getElementById('confirm-cancel').onclick = close;
                document.getElementById('confirm-ok').onclick = () => {
                    close();
                    onConfirm();

            async loadQuestions(notify = false) {
                const cfg = this.getConfig();
                if (cfg.googleSheetCsvUrl && cfg.googleSheetCsvUrl.trim() !== '') {
                    this.state.isLoadingQuestions = true;
                    if (this.state.view === 'home') this.render();

                    try {
                        const { questions, customDuration, customTitle } = await GoogleSheetsLoader.fetchFromUrl(cfg.googleSheetCsvUrl);
                        this.state.questions = questions;
                        this.state.dataSourceLabel = `Google Sheets (Onlayn • ${questions.length} savol)`;
                        localStorage.setItem(STORAGE_KEYS.QUESTIONS_CACHE, JSON.stringify(questions));

                        if (customDuration || customTitle) {

                            this.saveConfig(cfg);

                        if (notify) this.toast("Google Sheets jadvalidan savollar muvaffaqiyatli yuklandi!", "success");

                        console.warn("Google Sheets yuklashda xatolik:", err);
                        const cached = localStorage.getItem(STORAGE_KEYS.QUESTIONS_CACHE);
                        if (cached) {
                            this.state.questions = JSON.parse(cached);

                            this.state.questions = getFallbackQuestions();
                            this.state.dataSourceLabel = "Ichki zaxira baza (45 savol)";

                    this.state.dataSourceLabel = "Tayyor namunaviy baza (45 savol)";
